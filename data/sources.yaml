# The sources Agentwire reads. One entry per source, in alphabetical order by id.
#
# Every entry here is `proposed`: it names a source and the page a reader opens to see it. The
# addresses are untested and the job fetches nothing yet. A source becomes `verified` in the pull
# request that adds its `adapter` and `fetch` target, after the feed was fetched and parsed once.
#
# The schema and the meaning of each field are in src/schema/source.ts. `pnpm validate:data`
# checks this file. To propose a source, add an entry in a pull request.

