# The sources Agentwire reads. One entry per source, in alphabetical order by id.
#
# Only first-level sources start a story: the body, project, company or person that made the
# news (docs/DECISIONS.md). Sources in the `reactions` tier attach to a story and never start one.
#
# Every entry here is `proposed`: the job fetches nothing yet. Where an entry has an `adapter` and
# a `fetch` target, that target answered once by hand on 11 November 2026. A source becomes
# `verified` in the pull request that fetches and parses it with the real adapter. An entry
# without a fetch target carries a comment that says why.
#
# The schema and the meaning of each field are in src/schema/source.ts. `pnpm validate:data`
# checks this file. To propose a source, add an entry in a pull request.

